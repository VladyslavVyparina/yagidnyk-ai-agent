version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yagidnyk
      POSTGRES_PASSWORD: yagidnyk
      POSTGRES_DB: yagidnyk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://yagidnyk:yagidnyk@postgres:5432/yagidnyk?schema=public
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"

  admin-frontend:
    build:
      context: ./admin-frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://173.242.54.197:4000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads:
